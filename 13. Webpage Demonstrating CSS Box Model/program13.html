<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        body {
            background-color: lightgray;
        }

        h1 {
            text-align: center;
            color: blue;
        }

        p {
            width: 300px;
            height: 100px;
            padding: 20px;
            border: 5px solid blue;
            margin: 50px auto;
            background-color: lightyellow;
            text-align: center;
        }
    </style>

</head>
<body>

    <h1>CSS Box Model</h1>

    <p>
        This paragraph demonstrates
        the CSS Box Model.
        It includes content, padding,
        border and margin.
    </p>

</body>
</html>
