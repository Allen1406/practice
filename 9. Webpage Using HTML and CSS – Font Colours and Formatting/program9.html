<!DOCTYPE html>
<html>
<head>
    <title>HTML and CSS Styling</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
            font-size: 35px;
        }

        p {
            color: green;
            font-size: 18px;
            text-align: left;
        }

        .p2 {
            color: red;
            font-size: 20px;
            font-weight: bold;
        }

        .p3 {
            color: purple;
            font-size: 22px;
            font-style: italic;
            text-align: right;
        }
    </style>

</head>
<body>

    <h1>Welcome to My Webpage</h1>

    <p>
        HTML is used to create the structure
        of a webpage.
    </p>

    <p class="p2">
        CSS is used to style and design webpages.
    </p>

    <p class="p3">
        HTML and CSS are important technologies
        in web development.
    </p>

</body>
</html>
