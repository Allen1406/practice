<!DOCTYPE html>
<html>
<head>
    <title>Paragraph Styling</title>

    <style>
        h1 {
            text-align: center;
            color: blue;
        }

        p {
            padding: 15px;
            margin: 20px;
        }

        .p1 {
            background-color: lightblue;
            color: darkblue;
            font-size: 18px;
        }

        .p2 {
            background-color: lightgreen;
            color: green;
            font-size: 20px;
        }

        .p3 {
            background-color: lightyellow;
            color: red;
            font-size: 22px;
        }
    </style>

</head>
<body>

    <h1>Different Paragraph Colours</h1>

    <p class="p1">
        HTML is used to create the structure
        of webpages.
    </p>

    <p class="p2">
        CSS is used to add colours and styles
        to webpages.
    </p>

    <p class="p3">
        JavaScript is used to make webpages
        interactive and dynamic.
    </p>

</body>
</html>
