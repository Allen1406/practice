<!DOCTYPE html>
<html>
<head>
    <title>Navigation Menu</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        h1 {
            text-align: center;
            color: blue;
        }

        nav {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 18px;
        }

        nav a:hover {
            background-color: blue;
        }
    </style>

</head>
<body>

    <h1>My Website</h1>

    <nav>

        <a href="#home">Home</a>

        <a href="#about">About Us</a>

        <a href="#services">Services</a>

        <a href="#contact">Contact Us</a>

    </nav>

</body>
</html>
