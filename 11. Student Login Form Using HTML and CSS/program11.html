<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
        }

        .login {
            background-color: white;
            width: 300px;
            margin: 100px auto;
            padding: 25px;
            border: 2px solid blue;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
        }
    </style>

</head>
<body>

    <div class="login">

        <h2>Student Login</h2>

        <form>

            <label>Username:</label>

            <input type="text"
                   placeholder="Enter Username">

            <label>Password:</label>

            <input type="password"
                   placeholder="Enter Password">

            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
