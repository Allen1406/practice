<!DOCTYPE html>
<html>
<head>
    <title>Background Colour Example</title>

    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
            text-align: center;
            font-size: 35px;
        }

        p {
            color: black;
            font-size: 18px;
            text-align: justify;
        }

        .para {
            background-color: yellow;
            color: red;
            font-size: 20px;
            text-align: center;
            padding: 15px;
        }
    </style>

</head>
<body>

    <h1>HTML and CSS</h1>

    <p>
        HTML stands for HyperText Markup Language.
        It is used to create the structure of webpages.
    </p>

    <p class="para">
        CSS stands for Cascading Style Sheets.
        It is used to design and style webpages.
    </p>

</body>
</html>
